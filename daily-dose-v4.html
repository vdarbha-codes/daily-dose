<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Brain Quest: 15-Day Rotation</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        #game-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 650px; text-align: center; position: relative; }
        .hidden { display: none; }
        button { background: #4A90E2; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; margin: 8px; transition: 0.2s; font-weight: 600; }
        .cat-btn { background: #95a5a6; min-width: 130px; }
        .cat-btn.selected { background: #27ae60; }
        .option-btn { display: block; width: 100%; margin: 10px 0; background: #f8f9fa; color: #333; border: 2px solid #eee; text-align: left; padding-left: 20px; }
        .correct { background-color: #2ecc71 !important; color: white !important; }
        .wrong { background-color: #e74c3c !important; color: white !important; }
        #stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #34495e; background: #ecf0f1; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="setup-screen">
        <h1 style="color: #2c3e50;">Daily Brain Quest</h1>
        <input type="text" id="username" placeholder="Enter Player Name" style="padding: 12px; border-radius: 8px; border: 2px solid #ddd; width: 80%; margin-bottom: 15px;">
        
        <p><strong>Step 1: Choose Categories</strong></p>
        <div id="cat-selection">
            <button class="cat-btn selected" onclick="toggleCat(this, 'Hindu Mythology')">Mythology</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Harry Potter')">Harry Potter</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'History')">History</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Geography')">Geography</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Current Events')">Current Events</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Math/Patterns')">Math/Logic</button>
        </div>

        <p><strong>Step 2: Set Duration</strong></p>
        <button onclick="startGame(1)">1 Min</button>
        <button onclick="startGame(5)">5 Mins</button>
        <button onclick="startGame(10)">10 Mins</button>
        <div id="high-score-display" style="margin-top: 20px; color: #2ecc71; font-weight: bold;"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="stats">
            <span>⏱️ <span id="timer">0:00</span></span>
            <span id="streak-display">🔥 0</span>
            <span>🏆 <span id="score">0</span></span>
        </div>
        <div id="category-display" style="text-transform: uppercase; font-size: 0.8em; color: #4A90E2; font-weight: bold;"></div>
        <h2 id="question-text" style="color: #2c3e50; min-height: 60px;"></h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Session Complete</h2>
        <p id="final-score-text" style="font-size: 1.8em;"></p>
        <div id="quote-area" style="font-style: italic; background: #f9f9f9; padding: 15px; border-radius: 10px; margin: 20px 0;"></div>
        <button onclick="location.reload()">Return Home</button>
    </div>
</div>

<script>
    let score = 0, streak = 0, timeLeft = 0, timerInterval, currentUser = "";
    let selectedCats = ['Hindu Mythology', 'Harry Potter', 'History', 'Geography', 'Current Events', 'Math/Patterns'];
    const FIFTEEN_DAYS_MS = 15 * 24 * 60 * 60 * 1000;

    const triviaPool = [
        { id: 101, cat: "Hindu Mythology", q: "Which righteous Kaurava brother protested the disrobing of Draupadi?", a: "Vikarna", o: ["Vikarna", "Yuyutsu", "Dushasana", "Chitrasena"] },
        { id: 102, cat: "Hindu Mythology", q: "What was the name of Lord Krishna's conch shell?", a: "Panchajanya", o: ["Panchajanya", "Devadatta", "Anantavijaya", "Paundra"] },
        { id: 201, cat: "Harry Potter", q: "What animal represents the Hufflepuff house?", a: "Badger", o: ["Lion", "Eagle", "Snake", "Badger"] },
        { id: 301, cat: "History", q: "Who was the primary author of the US Declaration of Independence?", a: "Thomas Jefferson", o: ["John Adams", "Thomas Jefferson", "Benjamin Franklin", "George Washington"] },
        { id: 401, cat: "Geography", q: "Which country has the most natural lakes in the world?", a: "Canada", o: ["Russia", "Canada", "USA", "Brazil"] },
        { id: 501, cat: "Current Events", q: "In 2026, which city hosted the Super Bowl LX?", a: "Santa Clara", o: ["New Orleans", "Santa Clara", "Las Vegas", "Miami"] }
    ];

    window.onload = () => {
        const lastUser = localStorage.getItem('lastUser');
        if(lastUser) {
            document.getElementById('username').value = lastUser;
            const high = localStorage.getItem(`highScore_${lastUser}`) || 0;
            document.getElementById('high-score-display').innerText = `Your Best Score: ${high}`;
        }
    };

    function toggleCat(btn, cat) {
        btn.classList.toggle('selected');
        selectedCats.includes(cat) ? selectedCats = selectedCats.filter(c => c !== cat) : selectedCats.push(cat);
    }

    function startGame(mins) {
        currentUser = document.getElementById('username').value.trim() || "Seeker";
        localStorage.setItem('lastUser', currentUser);
        if (selectedCats.length === 0) return alert("Select a category!");
        score = 0; streak = 0; timeLeft = mins * 60;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        startTimer(); nextQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2,'0')}`;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function nextQuestion() {
        const currentCat = selectedCats[Math.floor(Math.random() * selectedCats.length)];
        if (currentCat === "Math/Patterns") {
            renderQuestion(generateLogicQ());
            return;
        }

        const now = Date.now();
        let history = JSON.parse(localStorage.getItem(`qHistory_${currentUser}`) || "{}");
        
        // Filter: Keep only questions that haven't been answered in the last 15 days
        let available = triviaPool.filter(q => {
            const lastAnswered = history[q.id] || 0;
            return q.cat === currentCat && (now - lastAnswered > FIFTEEN_DAYS_MS);
        });

        // If all are used, reset only that category's history for the user
        if (available.length === 0) {
            available = triviaPool.filter(q => q.cat === currentCat);
        }

        const qObj = available[Math.floor(Math.random() * available.length)];
        history[qObj.id] = now;
        localStorage.setItem(`qHistory_${currentUser}`, JSON.stringify(history));
        renderQuestion(qObj);
    }

    function generateLogicQ() {
        const a = Math.floor(Math.random()*50), b = Math.floor(Math.random()*50);
        return { cat: "Math/Logic", q: `Solve: ${a} + ${b}`, a: (a+b).toString(), o: shuffle([a+b, a+b+5, a+b-3, a+b+10]) };
    }

    function renderQuestion(q) {
        document.getElementById('category-display').innerText = q.cat;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        q.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                const btns = document.querySelectorAll('.option-btn');
                btns.forEach(b => b.disabled = true);
                if (opt.toString() === q.a.toString()) {
                    btn.classList.add('correct'); score += 10; streak++;
                } else {
                    btn.classList.add('wrong'); streak = 0;
                    btns.forEach(b => { if(b.innerText === q.a.toString()) b.classList.add('correct'); });
                }
                document.getElementById('score').innerText = score;
                document.getElementById('streak-display').innerText = `🔥 ${streak}`;
                setTimeout(nextQuestion, 1500);
            };
            container.appendChild(btn);
        });
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        const high = Math.max(score, localStorage.getItem(`highScore_${currentUser}`) || 0);
        localStorage.setItem(`highScore_${currentUser}`, high);
        document.getElementById('final-score-text').innerText = `Total Score: ${score}`;
        document.getElementById('quote-area').innerText = `"Arise, awake, and stop not until the goal is reached." - Swami Vivekananda`;
    }

    function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
</script>
</body>
</html>
