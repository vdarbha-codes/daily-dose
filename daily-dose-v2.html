<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Brain Quest: Streak Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        #game-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 650px; text-align: center; position: relative; }
        .hidden { display: none; }
        button { background: #4A90E2; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; margin: 8px; transition: 0.2s; }
        .cat-btn { background: #6c757d; min-width: 140px; }
        .cat-btn.selected { background: #2ecc71; border: 2px solid #27ae60; }
        .option-btn { display: block; width: 100%; margin: 10px 0; background: #f8f9fa; color: #333; border: 2px solid #e9ecef; }
        .correct { background-color: #2ecc71 !important; color: white !important; }
        .wrong { background-color: #e74c3c !important; color: white !important; }
        #stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #555; }
        #streak-display { color: #f39c12; font-size: 1.2em; }
        .category-tag { font-size: 0.85em; color: #4A90E2; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        #streak-alert { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #f39c12; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: none; animation: pop 0.5s ease; }
        @keyframes pop { 0% { transform: translateX(-50%) scale(0.5); } 100% { transform: translateX(-50%) scale(1); } }
    </style>
</head>
<body>

<div id="game-container">
    <div id="streak-alert">🔥 5 IN A ROW! +20 BONUS</div>
    
    <div id="setup-screen">
        <h2>Daily Brain Quest</h2>
        <input type="text" id="username" placeholder="Enter Name" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 70%;"><br>
        <p><strong>1. Select Categories:</strong></p>
        <div id="cat-selection">
            <button class="cat-btn selected" onclick="toggleCat(this, 'Hindu Mythology')">Mythology</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Geography')">Geography</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Math/Patterns')">Math/Logic</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Harry Potter')">Harry Potter</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'History')">History</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Current Events')">Current Events</button>
        </div>
        <p><strong>2. Duration:</strong></p>
        <button onclick="startGame(1)">1 Min</button>
        <button onclick="startGame(5)">5 Mins</button>
        <button onclick="startGame(10)">10 Mins</button>
        <div id="user-history" style="margin-top:15px; color: #7f8c8d;"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="stats">
            <span>Time: <span id="timer">0:00</span></span>
            <span id="streak-display">🔥 Streak: 0</span>
            <span>Score: <span id="score">0</span></span>
        </div>
        <div class="category-tag" id="category-display"></div>
        <h3 id="question-text"></h3>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 id="result-title">Time's Up!</h2>
        <p id="final-score-text" style="font-size: 1.5em; font-weight: bold;"></p>
        <p id="high-score-text"></p>
        <div id="quote-area" style="font-style: italic; margin-top: 20px; color: #555; padding: 20px; border-top: 1px solid #eee;"></div>
        <button onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>
    let score = 0, streak = 0, timeLeft = 0, timerInterval, currentUser = "";
    let selectedCats = ['Hindu Mythology', 'Geography', 'Math/Patterns', 'Harry Potter', 'History', 'Current Events'];
    let lastQuestionIds = JSON.parse(localStorage.getItem('lastQIds') || "[]");

    const triviaPool = [
        { id: 1, cat: "Hindu Mythology", q: "Who was the biological father of Bhishma in the Mahabharata?", a: "Shantanu", o: ["Pandu", "Shantanu", "Dhritarashtra", "Parashurama"] },
        { id: 2, cat: "Hindu Mythology", q: "Which bow did Lord Rama snap to win Sita's hand in marriage?", a: "Pinaka", o: ["Gandiva", "Pinaka", "Vijaya", "Sharanga"] },
        { id: 3, cat: "Harry Potter", q: "What is the name of the pub at the entrance to Diagon Alley?", a: "The Leaky Cauldron", o: ["The Leaky Cauldron", "The Three Broomsticks", "The Hog's Head", "The Green Dragon"] },
        { id: 4, cat: "History", q: "Who was the first woman to fly solo across the Atlantic?", a: "Amelia Earhart", o: ["Bessie Coleman", "Amelia Earhart", "Harriet Quimby", "Amy Johnson"] },
        { id: 5, cat: "Current Events", q: "As of Feb 2026, which country joined the BRICS alliance most recently?", a: "Saudi Arabia", o: ["Argentina", "Saudi Arabia", "Turkey", "Nigeria"] },
        { id: 6, cat: "Geography", q: "Which desert is the largest in the world?", a: "Antarctic Desert", o: ["Sahara", "Gobi", "Antarctic Desert", "Arabian"] },
        { id: 7, cat: "History", q: "The 'Boston Tea Party' was a protest against which country's tax laws?", a: "Great Britain", o: ["France", "Great Britain", "Spain", "Netherlands"] },
        { id: 8, cat: "Harry Potter", q: "What is the core of Harry Potter's wand?", a: "Phoenix Feather", o: ["Dragon Heartstring", "Unicorn Hair", "Phoenix Feather", "Veela Hair"] }
    ];

    function toggleCat(btn, cat) {
        btn.classList.toggle('selected');
        selectedCats.includes(cat) ? selectedCats = selectedCats.filter(c => c !== cat) : selectedCats.push(cat);
    }

    function startGame(mins) {
        currentUser = document.getElementById('username').value || "Player";
        if (selectedCats.length === 0) return alert("Select at least one category!");
        localStorage.setItem('lastUser', currentUser);
        score = 0; streak = 0; timeLeft = mins * 60;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        startTimer(); nextQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2,'0')}`;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function nextQuestion() {
        let qObj;
        const currentCat = selectedCats[Math.floor(Math.random() * selectedCats.length)];

        if (currentCat === "Math/Patterns") {
            qObj = generateLogicQ();
        } else {
            let available = triviaPool.filter(q => q.cat === currentCat && !lastQuestionIds.includes(q.id));
            if (available.length === 0) {
                lastQuestionIds = lastQuestionIds.filter(id => !triviaPool.some(tp => tp.id === id && tp.cat === currentCat));
                available = triviaPool.filter(q => q.cat === currentCat);
            }
            qObj = available[Math.floor(Math.random() * available.length)];
            trackQuestion(qObj.id);
        }
        renderQuestion(qObj);
    }

    function generateLogicQ() {
        const type = Math.random();
        if (type < 0.5) {
            const a = Math.floor(Math.random()*50), b = Math.floor(Math.random()*50);
            return { cat: "Math", q: `What is ${a} + ${b}?`, a: (a+b).toString(), o: shuffle([a+b, a+b+7, a+b-2, a+b+15]) };
        } else {
            const start = Math.floor(Math.random()*10), step = Math.floor(Math.random()*4)+3;
            return { cat: "Patterns", q: `Find X: ${start}, ${start+step}, ${start+step*2}, X`, a: (start+step*3).toString(), o: shuffle([start+step*3, start+step*3+step, start+step*2+1, 0]) };
        }
    }

    function trackQuestion(id) {
        lastQuestionIds.push(id);
        if (lastQuestionIds.length > 5) lastQuestionIds.shift();
        localStorage.setItem('lastQIds', JSON.stringify(lastQuestionIds));
    }

    function renderQuestion(q) {
        document.getElementById('category-display').innerText = q.cat;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        q.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                const btns = document.querySelectorAll('.option-btn');
                btns.forEach(b => b.disabled = true);
                if (opt.toString() === q.a.toString()) {
                    btn.classList.add('correct');
                    score += 10;
                    streak++;
                    if (streak % 5 === 0) { 
                        score += 20; 
                        showStreakAlert();
                    }
                } else {
                    btn.classList.add('wrong');
                    streak = 0;
                    btns.forEach(b => { if(b.innerText === q.a.toString()) b.classList.add('correct'); });
                }
                document.getElementById('score').innerText = score;
                document.getElementById('streak-display').innerText = `🔥 Streak: ${streak}`;
                setTimeout(nextQuestion, 1200);
            };
            container.appendChild(btn);
        });
    }

    function showStreakAlert() {
        const alert = document.getElementById('streak-alert');
        alert.style.display = 'block';
        setTimeout(() => alert.style.display = 'none', 1000);
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        const high = Math.max(score, localStorage.getItem(`highScore_${currentUser}`) || 0);
        localStorage.setItem(`highScore_${currentUser}`, high);
        document.getElementById('final-score-text').innerText = `Total Score: ${score}`;
        document.getElementById('high-score-text').innerText = `Your High Score: ${high}`;
        document.getElementById('quote-area').innerText = `"Arise, awake, and stop not until the goal is reached." - Swami Vivekananda`;
    }

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }
    
    window.onload = () => {
        const lastUser = localStorage.getItem('lastUser');
        if(lastUser) {
            document.getElementById('username').value = lastUser;
            const high = localStorage.getItem(`highScore_${lastUser}`) || 0;
            document.getElementById('user-history').innerText = `Welcome back! Current High Score: ${high}`;
        }
    };
</script>
</body>
</html>
