<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Brain Quest Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        #game-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        .hidden { display: none; }
        button { background: #4A90E2; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; transition: 0.2s; }
        .option-btn { display: block; width: 100%; margin: 10px 0; background: #f8f9fa; color: #333; border: 2px solid #e9ecef; }
        
        /* Feedback Colors */
        .correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; }
        
        #stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #555; }
        #category-display { font-size: 0.8em; text-transform: uppercase; color: #4A90E2; letter-spacing: 1px; margin-bottom: 10px;}
        #quote-area { margin-top: 20px; font-style: italic; color: #666; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="setup-screen">
        <h2>Daily Brain Quest</h2>
        <input type="text" id="username" placeholder="Enter your name" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 80%;"><br>
        <p>Select Play Time:</p>
        <button onclick="startGame(1)">1 Min</button>
        <button onclick="startGame(5)">5 Mins</button>
        <button onclick="startGame(10)">10 Mins</button>
        <div id="user-history"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="stats">
            <span>Time: <span id="timer">0:00</span></span>
            <span>Score: <span id="score">0</span></span>
        </div>
        <div id="category-display">Category</div>
        <h3 id="question-text">Loading...</h3>
        <div id="options-container"></div>
        <p id="feedback-text" style="font-weight: bold; min-height: 20px;"></p>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Session Complete!</h2>
        <p id="final-score-text"></p>
        <p id="high-score-text"></p>
        <div id="quote-area"></div>
        <button onclick="location.reload()">Back to Menu</button>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 0;
    let timerInterval;
    let currentUser = "";
    let lastQuestions = JSON.parse(localStorage.getItem('lastQuestions') || "[]");

    const triviaData = [
        { id: 1, cat: "Hindu Mythology", q: "In the Ramayana, which herbal medicine did Hanuman carry to save Lakshmana?", a: "Sanjeevani", o: ["Sanjeevani", "Tulsi", "Ashwagandha", "Soma"] },
        { id: 2, cat: "Hindu Mythology", q: "Who was the biological mother of Karna in the Mahabharata?", a: "Kunti", o: ["Gandhari", "Kunti", "Madri", "Satyavati"] },
        { id: 3, cat: "Hindu Mythology", q: "What was the name of Lord Krishna's conch shell used in the Kurukshetra war?", a: "Panchajanya", o: ["Devadatta", "Panchajanya", "Paundra", "Anantavijaya"] },
        { id: 4, cat: "Hindu Mythology", q: "Who composed the original Sanskrit Ramayana?", a: "Valmiki", o: ["Vyasa", "Valmiki", "Tulsidas", "Agastya"] },
        { id: 5, cat: "Hindu Mythology", q: "Which Kaurava brother attempted to save Draupadi during the disrobing incident?", a: "Vikarna", o: ["Dushasana", "Vikarna", "Yuyutsu", "Ashwatthama"] },
        { id: 6, cat: "Geography", q: "Which country has the longest coastline in the world?", a: "Canada", o: ["Russia", "Canada", "Australia", "USA"] },
        { id: 7, cat: "World Facts", q: "In which year did the Titanic sink?", a: "1912", o: ["1905", "1912", "1920", "1898"] }
    ];

    window.onload = () => {
        const lastUser = localStorage.getItem('lastUser');
        if(lastUser) {
            document.getElementById('username').value = lastUser;
            const high = localStorage.getItem(`highScore_${lastUser}`) || 0;
            document.getElementById('user-history').innerHTML = `High Score: <b>${high}</b>`;
        }
    };

    function startGame(mins) {
        currentUser = document.getElementById('username').value || "Player";
        localStorage.setItem('lastUser', currentUser);
        score = 0;
        timeLeft = mins * 60;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        startTimer();
        nextQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function nextQuestion() {
        document.getElementById('feedback-text').innerText = "";
        let qObj;
        const roll = Math.floor(Math.random() * 10);

        if (roll < 4) { // Mythology/Facts
            // Filter out the last 5 IDs
            let available = triviaData.filter(q => !lastQuestions.includes(q.id));
            if (available.length === 0) { lastQuestions = []; available = triviaData; }
            qObj = available[Math.floor(Math.random() * available.length)];
            lastQuestions.push(qObj.id);
            if(lastQuestions.length > 5) lastQuestions.shift();
            localStorage.setItem('lastQuestions', JSON.stringify(lastQuestions));
        } else {
            // Procedural generation (Math/Patterns)
            qObj = generateMathQuestion(roll);
        }
        renderQuestion(qObj);
    }

    function generateMathQuestion(roll) {
        if (roll < 6) {
            let a = Math.floor(Math.random() * 50);
            let b = Math.floor(Math.random() * 50);
            return { cat: "Basic Math", q: `Solve: ${a} + ${b}`, a: (a+b).toString(), o: shuffle([(a+b), (a+b+5), (a+b-3), (a+b+10)]) };
        } else if (roll < 8) {
            let s = Math.floor(Math.random() * 10);
            let d = Math.floor(Math.random() * 5) + 2;
            return { cat: "Patterns", q: `Next number: ${s}, ${s+d}, ${s+d*2}, ...`, a: (s+d*3).toString(), o: shuffle([(s+d*3), (s+d*3)+d, (s+d*3)-1, 0]) };
        } else {
            let n = [Math.floor(Math.random()*100), Math.floor(Math.random()*100), Math.floor(Math.random()*100)].sort((a,b)=>a-b);
            return { cat: "Order", q: `Ascending: ${[...n].sort(()=>Math.random()-.5).join(", ")}`, a: n.join(", "), o: [n.join(", "), n.reverse().join(", "), "None", "Random"] };
        }
    }

    function renderQuestion(q) {
        document.getElementById('category-display').innerText = q.cat;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        
        q.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q.a);
            container.appendChild(btn);
        });
    }

    function checkAnswer(btn, selected, correct) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true); // Prevent double clicking

        if(selected.toString() === correct.toString()) {
            btn.classList.add('correct');
            score += 10;
            document.getElementById('score').innerText = score;
        } else {
            btn.classList.add('wrong');
            // Highlight the correct one
            buttons.forEach(b => { if(b.innerText === correct.toString()) b.classList.add('correct'); });
        }

        setTimeout(nextQuestion, 1500); // 1.5 second pause to see the answer
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        const high = localStorage.getItem(`highScore_${currentUser}`) || 0;
        if (score > high) localStorage.setItem(`highScore_${currentUser}`, score);
        document.getElementById('final-score-text').innerText = `Final Score: ${score}`;
        document.getElementById('high-score-text').innerText = `Your High Score: ${Math.max(score, high)}`;
        document.getElementById('quote-area').innerText = `"Arise, awake, and stop not until the goal is reached." - Swami Vivekananda`;
    }

    function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
</script>
</body>
</html>
