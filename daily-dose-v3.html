<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Brain Quest: Memory Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        #game-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 650px; text-align: center; position: relative; }
        .hidden { display: none; }
        button { background: #4A90E2; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; margin: 8px; transition: 0.2s; font-weight: 600; }
        .cat-btn { background: #95a5a6; min-width: 130px; }
        .cat-btn.selected { background: #27ae60; }
        .option-btn { display: block; width: 100%; margin: 10px 0; background: #f8f9fa; color: #333; border: 2px solid #eee; text-align: left; padding-left: 20px; }
        .correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; }
        #stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #34495e; background: #ecf0f1; padding: 10px; border-radius: 10px; }
        #streak-display { color: #f39c12; }
        .category-tag { font-size: 0.75em; color: #4A90E2; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
        #streak-pop { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #f39c12; color: white; padding: 8px 20px; border-radius: 30px; font-weight: bold; display: none; z-index: 100; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="streak-pop">🔥 MEGA STREAK! +20</div>
    
    <div id="setup-screen">
        <h1 style="color: #2c3e50;">Brain Quest</h1>
        <p id="session-info" style="font-size: 0.9em; color: #7f8c8d;"></p>
        <input type="text" id="username" placeholder="Enter Player Name" style="padding: 12px; border-radius: 8px; border: 2px solid #ddd; width: 80%; margin-bottom: 15px;">
        
        <p><strong>Step 1: Choose Categories</strong></p>
        <div id="cat-selection">
            <button class="cat-btn selected" onclick="toggleCat(this, 'Hindu Mythology')">Mythology</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Harry Potter')">Harry Potter</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'History')">History</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Geography')">Geography</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Current Events')">Current Events</button>
            <button class="cat-btn selected" onclick="toggleCat(this, 'Math/Patterns')">Math/Logic</button>
        </div>

        <p><strong>Step 2: Game Length</strong></p>
        <button onclick="startGame(1)">1 Min</button>
        <button onclick="startGame(5)">5 Mins</button>
        <button onclick="startGame(10)">10 Mins</button>
        <div id="high-score-display" style="margin-top: 20px; font-weight: bold; color: #2ecc71;"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div id="stats">
            <span>⏱️ <span id="timer">0:00</span></span>
            <span id="streak-display">🔥 0</span>
            <span>🏆 <span id="score">0</span></span>
        </div>
        <div class="category-tag" id="category-display">Category</div>
        <h2 id="question-text" style="color: #2c3e50; font-size: 1.3em;">Question?</h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 style="color: #2c3e50;">Session Over!</h2>
        <p id="final-score-text" style="font-size: 2em; margin: 10px 0;"></p>
        <p id="best-score-text" style="color: #7f8c8d;"></p>
        <div id="quote-area" style="font-style: italic; background: #f9f9f9; padding: 20px; border-radius: 10px; margin: 20px 0;"></div>
        <button onclick="location.reload()">Start New Session</button>
    </div>
</div>

<script>
    let score = 0, streak = 0, timeLeft = 0, timerInterval, currentSession = 1;
    let selectedCats = ['Hindu Mythology', 'Harry Potter', 'History', 'Geography', 'Current Events', 'Math/Patterns'];
    
    // AUTHENTIC QUESTION POOL
    const triviaPool = [
        { id: 101, cat: "Hindu Mythology", q: "In Valmiki's Ramayana, what was the specific name of Lord Rama's bow?", a: "Kodanda", o: ["Pinaka", "Kodanda", "Gandiva", "Sharanga"] },
        { id: 102, cat: "Hindu Mythology", q: "Which son of Dhritarashtra famously sided with the Pandavas during the Kurukshetra war?", a: "Yuyutsu", o: ["Vikarna", "Yuyutsu", "Dushasana", "Chitrasena"] },
        { id: 103, cat: "Hindu Mythology", q: "Who was the charioteer of Karna during his final battle with Arjuna?", a: "Shalya", o: ["Krishna", "Shalya", "Sanjaya", "Adhiratha"] },
        { id: 104, cat: "Hindu Mythology", q: "In the Mahabharata, who was the biological father of Vidura?", a: "Vyasa", o: ["Shantanu", "Vyasa", "Pandu", "Bhishma"] },
        { id: 201, cat: "Harry Potter", q: "What is the only book in the series where Harry does not encounter Lord Voldemort in person?", a: "Prisoner of Azkaban", o: ["Chamber of Secrets", "Prisoner of Azkaban", "Half-Blood Prince", "Deathly Hallows"] },
        { id: 301, cat: "History", q: "Which US President signed the Emancipation Proclamation?", a: "Abraham Lincoln", o: ["George Washington", "Abraham Lincoln", "Thomas Jefferson", "Ulysses S. Grant"] },
        { id: 401, cat: "Geography", q: "Which European city is built on 118 small islands separated by canals?", a: "Venice", o: ["Amsterdam", "Venice", "Bruges", "Stockholm"] },
        { id: 501, cat: "Current Events", q: "Which nation launched the world's first fully AI-governed space station in early 2026?", a: "Japan", o: ["USA", "China", "Japan", "India"] }
    ];

    window.onload = () => {
        // Track sessions to avoid repeats for 5 sessions
        currentSession = parseInt(localStorage.getItem('sessionCount') || "0") + 1;
        localStorage.setItem('sessionCount', currentSession);
        document.getElementById('session-info').innerText = `Your Session #${currentSession}`;

        const lastUser = localStorage.getItem('lastUser');
        if(lastUser) {
            document.getElementById('username').value = lastUser;
            updateHighScoreUI(lastUser);
        }
    };

    function updateHighScoreUI(user) {
        const high = localStorage.getItem(`highScore_${user}`) || 0;
        document.getElementById('high-score-display').innerText = `Best Score: ${high}`;
    }

    function toggleCat(btn, cat) {
        btn.classList.toggle('selected');
        selectedCats.includes(cat) ? selectedCats = selectedCats.filter(c => c !== cat) : selectedCats.push(cat);
    }

    function startGame(mins) {
        const name = document.getElementById('username').value.trim() || "Seeker";
        localStorage.setItem('lastUser', name);
        if (selectedCats.length === 0) return alert("Select a category first!");
        
        score = 0; streak = 0; timeLeft = mins * 60;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        startTimer();
        nextQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2,'0')}`;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function nextQuestion() {
        let qObj;
        const currentCat = selectedCats[Math.floor(Math.random() * selectedCats.length)];

        if (currentCat === "Math/Patterns") {
            qObj = generateLogicQ();
        } else {
            // Memory Logic: Filter out questions used in current session or last 5 sessions
            let history = JSON.parse(localStorage.getItem('qHistory') || "{}");
            
            let available = triviaPool.filter(q => {
                const expiry = history[q.id] || 0;
                return q.cat === currentCat && expiry < currentSession;
            });

            if (available.length === 0) {
                // If pool is exhausted for this session/gap, reset for this category
                available = triviaPool.filter(q => q.cat === currentCat);
            }

            qObj = available[Math.floor(Math.random() * available.length)];
            
            // Mark question to expire in 5 sessions (current + 5)
            history[qObj.id] = currentSession + 5;
            localStorage.setItem('qHistory', JSON.stringify(history));
        }
        renderQuestion(qObj);
    }

    function renderQuestion(q) {
        document.getElementById('category-display').innerText = q.cat;
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        
        q.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(b => b.disabled = true);
                
                if (opt.toString() === q.a.toString()) {
                    btn.classList.add('correct');
                    score += 10; streak++;
                    if (streak % 5 === 0) { score += 20; flashStreak(); }
                } else {
                    btn.classList.add('wrong');
                    streak = 0;
                    allBtns.forEach(b => { if(b.innerText === q.a.toString()) b.classList.add('correct'); });
                }
                document.getElementById('score').innerText = score;
                document.getElementById('streak-display').innerText = `🔥 ${streak}`;
                setTimeout(nextQuestion, 1500);
            };
            container.appendChild(btn);
        });
    }

    function flashStreak() {
        const pop = document.getElementById('streak-pop');
        pop.style.display = 'block';
        setTimeout(() => pop.style.display = 'none', 1200);
    }

    function generateLogicQ() {
        const type = Math.random();
        if (type < 0.5) {
            const a = Math.floor(Math.random()*40), b = Math.floor(Math.random()*40);
            return { cat: "Math", q: `Solve: ${a} + ${b}`, a: (a+b).toString(), o: shuffle([a+b, a+b+4, a+b-2, a+b+10]) };
        } else {
            const s = Math.floor(Math.random()*5), d = Math.floor(Math.random()*6)+2;
            return { cat: "Patterns", q: `Missing: ${s}, ${s+d}, ${s+d*2}, ?`, a: (s+d*3).toString(), o: shuffle([s+d*3, s+d*4, s+d*3+1, 0]) };
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const user = localStorage.getItem('lastUser');
        const high = Math.max(score, localStorage.getItem(`highScore_${user}`) || 0);
        localStorage.setItem(`highScore_${user}`, high);
        
        document.getElementById('final-score-text').innerText = `Final Score: ${score}`;
        document.getElementById('best-score-text').innerText = `Your High Score: ${high}`;
        document.getElementById('quote-area').innerText = `"The only true wisdom is in knowing you know nothing." - Socrates`;
    }

    function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
</script>

</body>
</html>
